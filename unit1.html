    <script>
    document.addEventListener("DOMContentLoaded", async function () {
        const supabase = window.supabaseClient;
        if (!supabase) {
            console.error("Supabase مش متحمل!");
            return;
        }

        console.log("🔍 جاري البحث في قاعدة البيانات...");

        // بنجيب كل الدروس من الداتا بيز
        const { data: lessons, error } = await supabase
            .from('lessons_content')
            .select('*');

        if (error) {
            console.error("❌ خطأ في قاعدة البيانات:", error.message);
            return;
        }

        console.log("✅ الداتا اللي رجعت من السوبابيس:", lessons);

        if (!lessons || lessons.length === 0) {
            console.warn("⚠️ جدول lessons_content فاضي! مفيش أي فيديوهات متسجلة.");
            return;
        }

        // بندور على الكروت في الصفحة
        document.querySelectorAll(".lesson-info h3").forEach(titleElement => {
            const lessonName = titleElement.textContent.trim();
            
            // بندور على الدرس بالاسم
            const dbLesson = lessons.find(l => l.lesson_name === lessonName);
            
            if (dbLesson) {
                console.log("🎯 لقينا الدرس:", lessonName, dbLesson);
                
                const detailsElement = titleElement.closest('.lesson-details');
                
                // 1. نضيف الفيديو
                const iframe = detailsElement.querySelector('iframe');
                if (dbLesson.video_url && iframe) {
                    iframe.src = dbLesson.video_url;
                }

                // 2. نضيف الـ PDF
                const pdfBtn = detailsElement.querySelector('.pdf-button');
                if (dbLesson.pdf_url && pdfBtn) {
                    pdfBtn.href = dbLesson.pdf_url;
                    pdfBtn.style.display = 'inline-flex';
                }
            } else {
                // لو مش لاقي الدرس، هنطبع اسمه عشان نعرف المشكلة
                console.log(`❓ الدرس "${lessonName}" ملوش فيديو في الداتا بيز.`);
            }
        });
    });
    </script>

    <!-- المحتوى -->

    <main class="home-content">

        <section class="welcome-section">

                </p>

    <!-- القائمة السفلية -->

    <script src="supabase.js"></script>
    <script src="script.js"></script>


    <script>
        /* =========================================================
           عرض الدروس المسجلة من localStorage
        ========================================================= */

        document.addEventListener("DOMContentLoaded", function () {

            const watchedList = document.getElementById("watchedLessonsList");
            const emptyState = document.getElementById("emptyState");

            const watched = JSON.parse(localStorage.getItem("watched_lessons") || "[]");

            if (watched.length === 0) {
                emptyState.style.display = "block";
                return;
            }

            // ترتيب بالأحدث
            watched.sort(function (a, b) {
                return new Date(b.watched_at) - new Date(a.watched_at);
            });

            watched.forEach(function (lesson, index) {

                const lessonHTML = `
                <div class="lesson-card lesson-row">

                    <div class="lesson-number">${index + 1}</div>

                    <div class="lesson-info">
                        <span>${lesson.subject || "درس"}</span>
                        <h3>${lesson.title}</h3>
                    </div>

                    <a href="${lesson.url}" class="lesson-button-inline" style="text-decoration: none;">
                        <i class="fa-solid fa-play"></i>
                        <span>متابعة</span>
                    </a>

                </div>
            `;

                watchedList.insertAdjacentHTML("beforeend", lessonHTML);
            });
        });
    </script>

</body>

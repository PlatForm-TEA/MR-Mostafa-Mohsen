<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة القيصر | Intro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #f7cb72;
      --gold-light: #fff2c3;
      --gold-dark: #9c6722;
      --black: #030303;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: var(--black);
      color: white;
      font-family: "Cairo", sans-serif;
    }

    .intro {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 56%, #2b1b0b 0%, #100b06 28%, #030303 68%);
    }

    /* الخلفية السينمائية */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0, 0, 0, .42) 65%,
        #000 100%
      );
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 20%, #ffe4a3 99%, transparent),
        radial-gradient(2px 2px at 78% 18%, #dba84b 99%, transparent),
        radial-gradient(1px 1px at 85% 72%, #fff0bf 99%, transparent),
        radial-gradient(1px 1px at 23% 76%, #e9b960 99%, transparent),
        radial-gradient(2px 2px at 60% 12%, #f8d58a 99%, transparent);
      opacity: .55;
      animation: starsPulse 3s ease-in-out infinite alternate;
    }

    .light-beam {
      position: absolute;
      width: 2px;
      height: 0;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(
        to bottom,
        transparent,
        #fff4cb,
        #d99a39,
        transparent
      );
      box-shadow: 0 0 35px 9px rgba(247, 203, 114, .3);
      animation: beamReveal 2s .4s ease-out forwards;
    }

    .floor-light {
      position: absolute;
      width: min(1000px, 130vw);
      height: 240px;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(
        ellipse,
        rgba(219, 157, 65, .22),
        rgba(122, 71, 17, .08) 40%,
        transparent 72%
      );
      filter: blur(16px);
      opacity: 0;
      animation: floorReveal 2s 1s forwards;
    }

    /* المسرح */
    .stage {
      position: relative;
      z-index: 2;
      width: min(700px, 96vw);
      height: min(650px, 85vh);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    /* الكتاب */
    .book-wrap {
      position: absolute;
      width: min(480px, 83vw);
      height: 310px;
      top: 12%;
      left: 50%;
      transform: translateX(-50%) translateY(70px) scale(.45);
      opacity: 0;
      animation: bookArrive 1.5s 1.1s cubic-bezier(.16,1,.3,1) forwards;
    }

    .book {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      filter: drop-shadow(0 25px 35px rgba(0,0,0,.8));
      animation: bookFloat 4s 2.5s ease-in-out infinite;
    }

    .book-base {
      position: absolute;
      inset: 0;
      border-radius: 7px 7px 14px 14px;
      background: linear-gradient(180deg, #513015, #1a0e06);
      border: 1px solid #8b602c;
      box-shadow:
        inset 0 0 20px #000,
        0 0 30px rgba(236, 177, 83, .1);
    }

    .book-base::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(244, 199, 117, .45);
      border-radius: 4px;
    }

    .book-base::after {
      content: "";
      position: absolute;
      inset: auto 0 -10px;
      height: 12px;
      background: repeating-linear-gradient(
        to bottom,
        #d2ad70 0 1px,
        #62401d 1px 3px
      );
      border-radius: 0 0 5px 5px;
    }

    .pages {
      position: absolute;
      inset: 10px 9px 14px;
      display: flex;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .page {
      position: relative;
      width: 50%;
      height: 100%;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0 17px,
          rgba(135, 92, 39, .14) 18px,
          transparent 19px
        ),
        linear-gradient(110deg, #fff2d0, #d9b77c);
      box-shadow: inset 0 0 18px rgba(97, 56, 16, .28);
    }

    .page.left {
      border-radius: 5px 0 0 5px;
      transform-origin: right center;
      border-right: 1px solid #947047;
    }

    .page.right {
      border-radius: 0 5px 5px 0;
      transform-origin: left center;
    }

    .page-content {
      position: absolute;
      inset: 18px 12px;
      color: #6e461a;
      text-align: center;
      opacity: 0;
      animation: inkAppear 1s 3.3s forwards;
    }

    .page-heading {
      font-size: clamp(13px, 2vw, 18px);
      font-weight: 900;
      margin-bottom: 10px;
      color: #58320d;
    }

    .page-lines {
      height: 95px;
      margin-top: 12px;
      opacity: .65;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 8px,
        rgba(89, 55, 20, .55) 9px,
        transparent 10px
      );
    }

    .page-seal {
      width: 45px;
      height: 45px;
      border: 2px solid #966626;
      border-radius: 50%;
      margin: 12px auto;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: 900;
    }

    /* أوراق تتقلب */
    .flipper {
      position: absolute;
      z-index: 4;
      top: 10px;
      bottom: 14px;
      left: 50%;
      width: calc(50% - 9px);
      transform-origin: left center;
      transform-style: preserve-3d;
      border-radius: 0 5px 5px 0;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0 17px,
          rgba(130, 85, 31, .16) 18px,
          transparent 19px
        ),
        linear-gradient(110deg, #f5dfb2, #fff0cb);
      box-shadow: inset 0 0 12px rgba(97, 56, 16, .2);
      opacity: 0;
    }

    .flipper:nth-child(1) {
      animation: flipPage .8s 2.2s ease-in-out forwards;
    }

    .flipper:nth-child(2) {
      animation: flipPage .8s 2.65s ease-in-out forwards;
    }

    .flipper:nth-child(3) {
      animation: flipPage .8s 3.1s ease-in-out forwards;
    }

    .flipper:nth-child(4) {
      animation: flipPage .8s 3.55s ease-in-out forwards;
    }

    .spine {
      position: absolute;
      z-index: 5;
      top: 8px;
      bottom: 13px;
      left: 50%;
      width: 5px;
      transform: translateX(-50%);
      background: linear-gradient(to right, #5a3618, #f3ce7d, #70451c);
      box-shadow: 0 0 13px rgba(255, 214, 130, .45);
    }

    .gold-rim {
      position: absolute;
      inset: -18px;
      border: 1px solid rgba(238, 186, 90, .0);
      border-radius: 12px;
      animation: rimReveal 1.2s 2.5s forwards;
      pointer-events: none;
    }

    /* حلقة الطاقة */
    .magic-ring {
      position: absolute;
      top: 28%;
      left: 50%;
      width: min(560px, 95vw);
      aspect-ratio: 1;
      border: 1px solid rgba(244, 198, 108, .0);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotateX(70deg) scale(.3);
      box-shadow: 0 0 35px rgba(240, 185, 81, .0);
      animation: ringAppear 1.8s 2s ease-out forwards;
      pointer-events: none;
    }

    .magic-ring::before,
    .magic-ring::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px dashed rgba(255, 217, 139, .0);
      border-radius: 50%;
      animation: ringRotate 20s linear infinite;
    }

    .magic-ring::after {
      inset: 25%;
      border-style: solid;
      animation-direction: reverse;
    }

    /* الشعار */
    .brand {
      position: absolute;
      z-index: 6;
      bottom: 8%;
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(35px) scale(.85);
      animation: brandReveal 1.4s 4.3s cubic-bezier(.16,1,.3,1) forwards;
    }

    .brand-symbol {
      width: 75px;
      height: 75px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      position: relative;
      color: var(--gold-light);
      font-size: 48px;
      font-weight: 900;
      text-shadow: 0 0 25px rgba(255, 194, 74, .75);
    }

    .brand-symbol::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 20px rgba(241, 188, 83, .22);
    }

    .brand h1 {
      font-size: clamp(32px, 7vw, 57px);
      font-weight: 900;
      line-height: 1.5;
      letter-spacing: 1px;
      color: #fff1c9;
      text-shadow:
        0 0 10px rgba(255, 205, 113, .8),
        0 0 35px rgba(198, 130, 34, .5);
    }

    .brand p {
      margin-top: 2px;
      font-size: clamp(10px, 2.5vw, 14px);
      letter-spacing: 4px;
      color: #d5b77e;
    }

    .brand-line {
      width: 0;
      height: 1px;
      margin: 8px auto 0;
      background: linear-gradient(90deg, transparent, #f8d58d, transparent);
      animation: lineReveal 1s 5s forwards;
    }

    /* الجزيئات */
    #particles {
      position: absolute;
      inset: 0;
      z-index: 5;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .skip {
      position: absolute;
      z-index: 10;
      left: 22px;
      bottom: 22px;
      border: 1px solid rgba(240, 203, 126, .3);
      border-radius: 30px;
      padding: 8px 18px;
      color: #e9cf99;
      background: rgba(0,0,0,.4);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: .25s;
    }

    .skip:hover {
      background: rgba(190, 133, 48, .2);
      border-color: var(--gold);
    }

    .loading {
      position: absolute;
      z-index: 9;
      bottom: 26px;
      right: 24px;
      color: rgba(240, 210, 157, .6);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .loading span {
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--gold);
      animation: dotPulse 1s infinite alternate;
    }

    .intro.exit {
      animation: exitScene 1s ease forwards;
    }

    @keyframes beamReveal {
      0% { height: 0; opacity: 0; }
      30% { opacity: 1; }
      100% { height: 80%; opacity: .55; }
    }

    @keyframes floorReveal {
      to { opacity: 1; }
    }

    @keyframes starsPulse {
      from { opacity: .25; }
      to { opacity: .75; }
    }

    @keyframes bookArrive {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(70px) scale(.45) rotateX(20deg);
      }
      70% { opacity: 1; }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1) rotateX(0);
      }
    }

    @keyframes bookFloat {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-8px) rotateX(2deg); }
    }

    @keyframes flipPage {
      0% {
        opacity: 0;
        transform: rotateY(0deg);
      }
      12% { opacity: 1; }
      85% { opacity: 1; }
      100% {
        opacity: 0;
        transform: rotateY(-180deg);
      }
    }

    @keyframes inkAppear {
      to { opacity: .82; }
    }

    @keyframes rimReveal {
      to {
        border-color: rgba(238, 186, 90, .4);
        box-shadow: 0 0 28px rgba(238, 186, 90, .1);
      }
    }

    @keyframes ringAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotateX(70deg) scale(.3);
      }
      100% {
        opacity: .8;
        transform: translate(-50%, -50%) rotateX(70deg) scale(1);
        border-color: rgba(244, 198, 108, .35);
        box-shadow: 0 0 35px rgba(240, 185, 81, .12);
      }
    }

    @keyframes ringRotate {
      to { transform: rotate(360deg); }
    }

    @keyframes brandReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes lineReveal {
      to { width: min(260px, 70vw); }
    }

    @keyframes dotPulse {
      to { opacity: .2; }
    }

    @keyframes exitScene {
      to {
        opacity: 0;
        filter: blur(12px);
        transform: scale(1.04);
      }
    }

    @media (max-height: 650px) {
      .book-wrap {
        top: 7%;
        transform-origin: top center;
      }

      .brand {
        bottom: 3%;
      }

      .brand-symbol {
        width: 48px;
        height: 48px;
        font-size: 31px;
        margin-bottom: 0;
      }

      .brand h1 {
        font-size: 32px;
      }

      .stage {
        height: 95vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="intro" id="intro">
    <div class="stars"></div>
    <div class="light-beam"></div>
    <div class="floor-light"></div>
    <div class="magic-ring"></div>

    <canvas id="particles"></canvas>

    <section class="stage">
      <div class="book-wrap">
        <div class="book">
          <div class="book-base"></div>

          <div class="pages">
            <div class="page left">
              <div class="page-content">
                <div class="page-heading">طريق المعرفة</div>
                <div class="page-seal">ق</div>
                <div class="page-lines"></div>
              </div>
            </div>

            <div class="page right">
              <div class="page-content">
                <div class="page-heading">بداية المستقبل</div>
                <div class="page-lines"></div>
                <div class="page-seal">✦</div>
              </div>
            </div>
          </div>

          <div class="flipper"></div>
          <div class="flipper"></div>
          <div class="flipper"></div>
          <div class="flipper"></div>

          <div class="spine"></div>
          <div class="gold-rim"></div>
        </div>
      </div>

      <div class="brand">
        <div class="brand-symbol">ق</div>
        <h1>منصة القيصر</h1>
        <p>KNOWLEDGE · POWER · FUTURE</p>
        <div class="brand-line"></div>
      </div>
    </section>

    <div class="vignette"></div>

    <div class="loading">
      جاري فتح أبواب المعرفة <span></span>
    </div>

    <button class="skip" id="skip">تخطي المقدمة ↗</button>
  </main>

  <script>
    const intro = document.getElementById("intro");
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    let width, height, particles = [];
    let animationFrame;
    let finished = false;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    class Particle {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = width * .5 + (Math.random() - .5) * width * .8;
        this.y = initial
          ? Math.random() * height
          : height * .65 + Math.random() * height * .3;

        this.size = Math.random() * 2 + .4;
        this.speedY = Math.random() * -1.2 - .2;
        this.speedX = (Math.random() - .5) * .8;
        this.life = Math.random() * 120 + 40;
        this.alpha = Math.random() * .7 + .15;
        this.phase = Math.random() * Math.PI * 2;
      }

      update() {
        this.x += this.speedX + Math.sin(this.phase) * .25;
        this.y += this.speedY;
        this.life--;
        this.phase += .025;

        if (this.life <= 0 || this.y < -10) {
          this.reset();
        }
      }

      draw() {
        const flicker = .5 + Math.sin(this.phase) * .5;

        ctx.beginPath();
        ctx.fillStyle = `rgba(255, ${190 + flicker * 45}, ${90 + flicker * 80}, ${this.alpha * flicker})`;
        ctx.shadowColor = "#e9ae4c";
        ctx.shadowBlur = this.size * 7;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = Array.from(
        { length: Math.min(150, Math.floor(width / 7)) },
        () => new Particle()
      );
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });

      ctx.shadowBlur = 0;
      animationFrame = requestAnimationFrame(animateParticles);
    }

    function enterSite() {
      if (finished) return;
      finished = true;

      cancelAnimationFrame(animationFrame);
      intro.classList.add("exit");

      setTimeout(() => {
        window.location.replace("home.html");
      }, 850);
    }

    document.getElementById("skip").addEventListener("click", enterSite);

    window.addEventListener("resize", initParticles);

    initParticles();
    animateParticles();

    // مدة المقدمة حوالي 8.5 ثانية
    setTimeout(enterSite, 8500);
  </script>
</body>
</html>

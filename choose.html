<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>اختيار النظام التعليمي</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="choose-page">


    <main class="choose-container">


        <!-- اللوجو -->

        <div class="choose-logo">

            <img src="1.jpeg" alt="شعار منصة القيصر">

        </div>



        <!-- العنوان -->

        <div class="choose-header">

            <h1>اختر نظامك التعليمي</h1>

            <p>اختر النظام الذي تدرس به للمتابعة</p>

        </div>



        <!-- الاختيارات -->

        <div class="choices">


            <!-- الثانوية العامة -->

            <a href="high-school.html" class="choice-card" id="generalSecondary">

                <div class="choice-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <h2>الثانوية العامة</h2>

                <p>الدخول إلى منصة الثانوية العامة</p>

                <span>
                    دخول
                    <i class="fa-solid fa-arrow-left"></i>
                </span>

            </a>



            <!-- البكالوريا -->

            <a href="baccalaureate.html" class="choice-card" id="baccalaureate">



                <div class="choice-icon">
                    <i class="fa-solid fa-book"></i>
                </div>

                <h2>البكالوريا</h2>

                <p>الدخول إلى منصة البكالوريا</p>

                <span>
                    دخول
                    <i class="fa-solid fa-arrow-left"></i>
                </span>

            </a>



            <!-- التقييمات -->

            <a href="reviews.html" class="choice-card" id="reviews">

                <div class="choice-icon">
                    <i class="fa-solid fa-star"></i>
                </div>

                <h2>التقييمات</h2>

                <p>قيّم تجربتك معنا</p>

                <span>
                    دخول
                    <i class="fa-solid fa-arrow-left"></i>
                </span>

            </a>


        </div>


    </main>



    <script src="supabase.js"></script>
    <script src="script.js"></script>


</body>

</html>
